version: '3.8'

services:
  app:
    build: .
    container_name: sales-detective
    ports:
      - "8501:8501" # Streamlit
      - "8000:8000" # FastAPI
    environment:
      - API_URL=http://localhost:8000
    # --- CRITICAL FIX: Healthcheck uses curl (now installed) ---
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s