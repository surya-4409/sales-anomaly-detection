version: '3.8'

services:
  app:
    build: .
    container_name: sales-detective
    ports:
      - "8000:8000"  # Map API port
      - "8501:8501"  # Map UI port
    env_file:
      - .env
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL}
      - API_URL=http://localhost:8000
    # Run API in background (&) and Streamlit in foreground
    command: >
      sh -c "uvicorn app.main:app --host 0.0.0.0 --port 8000 &
             streamlit run app/ui.py --server.port 8501 --server.address 0.0.0.0"
    
    # The Robot Inspector (Healthcheck)
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s